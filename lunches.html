<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <title>Собрать ланч</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
	    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
		href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="style_lunches.css">
        <script src="getdish.js"></script>
        <script src="raspdish.js"></script>
    </head>
    <!--тело страницы-->
    <body>
        <header class="header">
            <h1>Интернет-кафе Милс</h1>
            <nav>
                <a href="index.html">О нас</a>
                <a href="">Услуги</a>
                <a href="lunches.html" class = "active">Собрать ланч</a>
                <a href="">Забронировать</a>
                <a href="#footer1">Контакты</a>
            </nav>
        </header>
        <main>
            <section class="soups">
                <h2>Супы</h2>
                <div class = "dish_grid">
                </div>
            </section>
            <section class="main_dishes">
                <h2>Главные блюда</h2>
                <div class = "dish_grid">
                </div>
            </section>
            <section class="drinks">
                <h2>Напитки</h2>
                <div class = "dish_grid">
                </div>
            </section>

            <section class = "forma">
                <form class = "order-form" action="https://httpbin.org/post" method = "POST">
                    <h2>Сделать заказ</h2>
                    <div class="form-column">
                        <div class="column_one">
                            <h3>
                                Ваш заказ
                            </h3>
                            <div class="order_empty">Ничего не выбрано</div>
                            <label for="soup">Суп</label>
                            <input type="text" name="soup" id="soup" required readonly placeholder="Суп не выбран"/>
                            <label for="maindish">Выберите главное блюдо</label>
                            <input type="text" name="maindish" id="maindish" required readonly placeholder="Главное блюдо не выбрано"/>
                            <label for="drink">Выберите напиток</label>
                            <input type="text" name="drink" id="drink" required readonly placeholder="Напиток не выбран"/>
                            <label for="total">Стоимость заказа</label>
                            <output name="total" id="total" class="total"></output>
                            <label for="comment">Комментарий к заказу</label>
                            <textarea name="comment" id="comment"
                            rows="4" placeholder="Например: положите 3 котлеты вместо двух"></textarea>
                        </div>
                        <div class="client_col">
                            <h3>Ваши данные</h3>
                            <label for="name">Имя</label>
                            <input type="text" id="name" name="name" required placeholder="Иванов Иван Иванович"/>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="iiivan@mail.ru"/>
                            <div class="checkbox">
                                <input type="checkbox" id="subcribe" name="subscribe" checked/>
                                <label for="subscribe">Подписаться на рассылку</label>
                            </div>
                            <label for="phone">Телефон</label>
                            <input type="tel" id="phone" name = "phone" required placeholder="+8 (800) 555-35-35"/>
                            <label for="address">Адрес доставки</label>
                            <input type="text" name="address" id="address" required placeholder="ул. Улица, д. 1, кв. 10"/>
                            <fieldset class="delivery_time">
                                <legend>Время доставки</legend>
                                <div class = "radio_row">
                                    <input type="radio" id="deliv_asap" name="deliv_type" value="asap" required/>
                                    <label for="deliv_asap">Как можно скорее</label>
                                </div>
                                <div class="radio_row">
                                    <input type="radio" id="deliv_time" name="deliv_type" value="time"/>
                                    <label for="deliv_time">Выбрать время</label>
                                </div>
                            </fieldset>
                            <label for="deliv_time_value">Укажите время доставки</label>
                            <input type="time" id="deliv_time_value" name="deliv_time_value" min="08:00" max="23:00" step="300" placeholder="08:00"/>
                            <div class="form_buttons">
                                <button type="reset" class="btn_reset">Сбросить</button>
                                <button type="submit" class="btn_submit">Отправить</button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>
            
            
        </main>
        <footer class = "footer" id="footer1">
            <p>Позвонить нам: +7 800 555 35 35</p>
            <p>&COPY; </p>        
        </footer>
    </body>
</html>
